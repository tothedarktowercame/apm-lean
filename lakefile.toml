name = "ApmCanaries"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ApmCanaries"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "ApmCanaries"
