name = "ApmCanaries"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ApmCanaries"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "ApmCanaries"

# ConstructionTargets holds reusable lemmas proved to unblock specific problems
# (Schwarz equality case, radial R3 integration, Rouché transfer, lemniscate
# components). Until 2026-07-30 there was no lean_lib for it, so the files were
# NOT on the module path: `import ConstructionTargets.X` failed with "unknown
# module prefix" and no oleans were ever produced. The proved lemmas were
# therefore unreachable from the problems they were built for.
[[lean_lib]]
name = "ConstructionTargets"

# YoungL2 holds an axiom-clean `convolution_L2_contraction_of_probability_kernel`
# (4 declarations, 0 sorries). It had the SAME defect ConstructionTargets had:
# no lean_lib, so it was not on the module path and `import YoungL2` failed with
# "unknown module prefix". a94J04's runner hit this on 2026-07-31 and reported
# the proved lemma as unreachable. Added by claude-9, same fix as above.
[[lean_lib]]
name = "YoungL2"

[[lean_lib]]
name = "ApmProblems"
srcDir = "problems"
roots = ["a01J03.lean.Main"]
